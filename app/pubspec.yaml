name: streammkv
description: Delos — films and music from your seedbox.
publish_to: 'none'
version: 2.8.4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  audio_service: ^0.18.15
  file_picker: ^10.1.0
  background_downloader: ^9.6.6
  path_provider: ^2.1.5
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

dependency_overrides:
  # 2.3.x (JNI) can't find android.content.Context in release builds →
  # getApplicationSupportDirectory throws and the app hangs on the splash.
  path_provider_android: 2.2.23
