name: streammkv
description: StreamMKV — watch MKV files from your seedbox.
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D0F13"
  adaptive_icon_foreground: assets/icon_fg.png
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256

flutter:
  uses-material-design: true
