name: android
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the APKs to
        type: string
        required: false
      version:
        description: App version (X.Y.Z)
        type: string
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter --version
          flutter create --org dev.un4ckn0wl3z --project-name streammkv --platforms android .
          python3 tool/patch_android.py
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using persistent signing key from secrets"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 secret not set — APK is signed with a throwaway key (updates will need uninstall)"
          fi
      - name: Build APK
        working-directory: app
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(tr -d ' \n' < ../VERSION)-ci"
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$(( MA * 10000 + MI * 100 + PA ))   # monotonic Android versionCode
          echo "version=$VERSION versionCode=$CODE"
          flutter pub get
          dart run flutter_launcher_icons -f icons/android.yaml
          flutter build apk --release --split-per-abi \
            --build-name="${VERSION%%-*}" --build-number="$CODE" --dart-define=APP_VERSION="$VERSION"
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk ../dist/streammkv-android-$abi.apk
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: streammkv-android
          path: dist/*.apk

  # Install the x86_64 APK on an emulator and make sure it starts (no
  # unhandled Dart exception / crash) before it can reach a release.
  launch:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streammkv-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test server for the music check
        run: bash tools/ci-music-server.sh
      - name: Start the app on an emulator (+ background music check)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim
          script: bash tools/android-launch-test.sh dist/streammkv-android-x86_64.apk && (bash tools/android-music-test.sh || echo "::warning::background music check failed")
      - name: Music check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-test
          path: music-test/
          if-no-files-found: ignore
      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.apk --clobber -R "$GITHUB_REPOSITORY"
