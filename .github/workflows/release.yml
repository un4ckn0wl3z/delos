name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
permissions:
  contents: write
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/streammkv-linux-$arch .
          done
          ls -la dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "Install on a seedbox (no root):
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/deploy/install.sh | MEDIA_ROOT=~/torrents bash
          \`\`\`

          Android app: install \`streammkv-android-arm64-v8a.apk\` (most phones)."
          fi
  android:
    needs: server
    uses: ./.github/workflows/app.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
