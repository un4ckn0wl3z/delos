name: smoke-android
on:
  push:
    branches: [smoke-android]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v1.8.0 -R ${{ github.repository }} -p 'streammkv-android-x86_64.apk'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r streammkv-android-x86_64.apk
            adb logcat -c
            adb shell monkey -p dev.un4ckn0wl3z.streammkv -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof dev.un4ckn0wl3z.streammkv || echo "PROCESS NOT RUNNING"
            adb shell dumpsys activity activities | grep -i -m5 "mResumedActivity\|topResumedActivity" || true
            adb exec-out screencap -p > shot.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1; adb shell cat /sdcard/u.xml | grep -o 'text="[^"]*"\|content-desc="[^"]*"' | grep -v '=""' | head -40 || true
            PID=$(adb shell pidof dev.un4ckn0wl3z.streammkv | tr -d '\r'); echo "PID=$PID"
            [ -n "$PID" ] && adb logcat -d --pid=$PID | tail -120 || true
            adb logcat -d > logcat.txt
            grep -n -i -E "FATAL|AndroidRuntime|flutter|E/|Exception|streammkv" logcat.txt | head -300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            shot.png
            logcat.txt
