name: dlna
on:
  push:
    paths: ['app/lib/dlna/**', 'app/tool/dlna_check.*', '.github/workflows/dlna.yml']
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Analyze
        run: |
          mkdir -p ../d/bin && cp app/lib/dlna/dlna_server.dart app/tool/dlna_check.dart ../d/bin/
          printf 'name: d\nenvironment:\n  sdk: ^3.5.0\n' > ../d/pubspec.yaml
          cd ../d && dart pub get && dart analyze --fatal-infos bin
      - name: Serve and browse like a TV
        run: |
          W=$PWD
          (cd ../d && dart run bin/dlna_check.dart > ../srv.log 2>&1 &)
          for i in $(seq 1 90); do grep -q READY ../srv.log && break; sleep 1; done
          cat ../srv.log
          python "$W/app/tool/dlna_check.py" || (cat ../srv.log; exit 1)
          pkill -f dlna_check.dart || true
