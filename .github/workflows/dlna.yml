name: dlna
on:
  push:
    paths: ['app/lib/dlna/**', 'app/tool/dlna_check.*', '.github/workflows/dlna.yml']
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: ffmpeg (the same builds the app downloads)
        run: |
          mkdir -p ../ff && cd ../ff
          if [ "$RUNNER_OS" = Windows ]; then
            curl -sSfL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            /c/Windows/System32/tar.exe -xf ff.zip  # the same Windows tar the app uses
            echo "FFMPEG=$(cygpath -w "$(ls -d $PWD/ffmpeg-*/bin)")\\ffmpeg.exe" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = macOS ]; then
            A=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
            for t in ffmpeg ffprobe; do
              curl -sSfL -o $t.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$A/release/$t.zip"
              /usr/bin/ditto -x -k $t.zip .
            done
            chmod 755 ffmpeg ffprobe; codesign -dv ffmpeg 2>&1 | head -3 || true
            echo "FFMPEG=$PWD/ffmpeg" >> $GITHUB_ENV
          else
            curl -sSfL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xf ff.tar.xz
            echo "FFMPEG=$(ls -d $PWD/ffmpeg-*/bin)/ffmpeg" >> $GITHUB_ENV
          fi
      - name: Analyze
        run: |
          mkdir -p ../d/bin && cp app/lib/dlna/dlna_server.dart app/tool/dlna_check.dart ../d/bin/
          printf 'name: d\nenvironment:\n  sdk: ^3.5.0\n' > ../d/pubspec.yaml
          cd ../d && dart pub get && dart analyze --fatal-infos bin
      - name: Serve and browse like a TV
        run: |
          echo "ffmpeg: $FFMPEG"
          W=$PWD
          (cd ../d && dart run bin/dlna_check.dart > ../srv.log 2>&1 &)
          for i in $(seq 1 120); do grep -q READY ../srv.log && break; sleep 1; done
          cat ../srv.log
          L="$(cd .. && pwd)/srv.log"; PY=python3
          if [ "$RUNNER_OS" = Windows ]; then L=$(cygpath -w "$L"); PY=python; fi
          SRVLOG="$L" $PY "$W/app/tool/dlna_check.py" || (cat ../srv.log; exit 1)
          pkill -f dlna_check.dart || true
